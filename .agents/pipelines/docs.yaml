name: docs
description: "Documentation and spec authoring workflow"
stages:
  - id: authoring
    role: "Doc Author"
    verify:
      type: "diff_present"
    directive: "Write documentation according to style guidelines."
    on_success: "next"
    on_failure: "retry"

  - id: critic
    role: "Doc Critic"
    verify:
      type: "review"
    directive: "Review technical clarity, accuracy, and cross-links."
    on_success: "next"
    on_failure: "authoring"

  - id: gatekeeper
    verify:
      type: "all_claims"

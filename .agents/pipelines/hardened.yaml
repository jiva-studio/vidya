name: hardened
description: "Hardened TDD workflow with diff mutation analysis, survived mutant loop, and adversarial review for core/critical features"
stages:
  - id: red-phase
    role: "Test Author"
    verify:
      type: "tests_red"
      patterns: [".spec.", ".test.", "/tests/", "/specs/"]
    directive: "Author Red test suite strictly derived from spec.md acceptance criteria and prove red failure."
    on_success: "next"
    on_failure: "retry"

  - id: green-phase
    role: "Code Implementer"
    verify:
      type: "tests_green"
      forbid_edits: ["tests/**", "**/*.spec.*", "**/specs/**"]
    directive: "Implement minimal clean code to turn tests green without editing test files."
    on_success: "next"
    on_failure: "retry"

  - id: mutation-gate
    verify:
      type: "claim"
      claim_tool: "mutation"
    on_success: "next"
    on_failure:
      target: "adversarial-review"
      pass_artifacts: ["survived_mutants"]

  - id: adversarial-review
    role: "Adversarial Reviewer"
    verify:
      type: "review"
    inputs: ["diff", "survived_mutants"]
    directive: "Break the implementation using intent.md invariants and eliminate all survived mutants."
    on_success: "next"
    on_failure: "red-phase"

  - id: gatekeeper
    verify:
      type: "all_claims"

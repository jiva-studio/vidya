name: fast
description: "Fast-path workflow for simple hotfixes, formatting, and UI styling"
stages:
  - id: implementation
    role: "Solo Coder"
    verify:
      type: "tests_green"
    directive: "Implement fix and verify narrow tests pass."
    on_success: "next"
    on_failure: "retry"

  - id: gatekeeper
    verify:
      type: "all_claims"

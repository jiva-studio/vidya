# Local development stand.
#
# Ports follow one scheme, so nothing has to be remembered twice:
#
#   780x  infrastructure      7800 postgres · 7801 redis · 7802 smtp · 7803 mail ui
#   781x  applications        7810 api · 7811 admin · 7812 storybook · 7813 gateway
#                             7814 student site · 7815 gateway, console host
#
# Nothing here is reachable on a default port, so a system Postgres or Redis
# already running on this machine cannot be hit by accident.
#
# The API is not one of these services — it runs on the host, via `make dev` —
# so its environment is not set here. That includes VIDYA_JWT_SECRET, which
# `make dev` exports a fixture value for; see the "Local stand" section of the
# root Makefile. It has no default in code: `configs/jwt.config.ts` refuses to
# start without it.
#
# `gateway` is the odd one out: it sits behind the `gateway` profile, so
# `docker compose up` (what `make dev-up` runs) never starts it. It is an
# option for exercising the production shape locally — see
# services/gateway/README.md — not a dependency of the everyday dev flow,
# which still runs the admin through Vite's own dev server. Bring it up with
# `make gateway-up`.

services:
  postgres:
    image: postgres:17-alpine
    container_name: vidya-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '7800:5432'
    volumes:
      - vidya-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vidya-redis
    ports:
      - '7801:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends; nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    container_name: vidya-mailpit
    ports:
      - '7802:1025' # smtp
      - '7803:8025' # web ui and http api
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Reverse proxy in front of the two built applications and the API. Opt-in
  # (see the `gateway` profile note above); `make gateway-up` passes
  # `--build`, so a source change is picked up on the next run rather than
  # serving a stale bundle. TLS is off by default here — there is no
  # certificate to hand it in a dev stand — so this only exercises the
  # same-origin routing, the coarse rate limit and the documents' headers, not
  # the TLS path. See services/gateway/README.md.
  gateway:
    build:
      context: ..
      dockerfile: modules/services/gateway/Dockerfile
    container_name: vidya-gateway
    profiles: ['gateway']
    ports:
      # Two ports are two origins, which is what the two hosts of a real
      # deployment give: localStorage, IndexedDB and Web Locks stay apart
      # without any DNS to arrange. See services/gateway/README.md.
      - '7813:8080' # student site
      - '7815:8081' # console
    environment:
      VIDYA_GATEWAY_API_UPSTREAM: http://host.docker.internal:${VIDYA_API_PORT:-7810}
      VIDYA_GATEWAY_RATE_LIMIT_RPS: ${VIDYA_GATEWAY_RATE_LIMIT_RPS:-20}
      VIDYA_GATEWAY_RATE_LIMIT_BURST: ${VIDYA_GATEWAY_RATE_LIMIT_BURST:-40}
    extra_hosts:
      # The API runs on the host, not in this compose file (see above) — this
      # is how the container reaches it. Linux needs the explicit mapping;
      # Docker Desktop (macOS/Windows) already resolves the name without it.
      - 'host.docker.internal:host-gateway'

volumes:
  vidya-postgres:

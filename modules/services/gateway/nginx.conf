# Base config. What varies by deployment (upstream address, TLS on/off, rate
# limit numbers) is not here — it is filled into conf.d/server.conf by
# docker-entrypoint.sh from one of templates/*.conf.template, so this file
# stays the same in every environment.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The base image already points these at /dev/stdout and /dev/stderr;
  # repeated here so the gateway's logs stay on the streams `docker logs`
  # captures even if that default ever changes upstream.
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}

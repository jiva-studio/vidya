name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: modules

      # The same gate developers run locally: typecheck, lint, format:check, test.
      # Keeping CI on `make check` means the two can never drift apart.
      - name: Run quality gate
        run: make check

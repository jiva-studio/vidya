name: Scheduled

on:
  schedule:
    # Mondays, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  test-postgres:
    name: Full suite against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - run: npm ci
        working-directory: modules

      # Every suite with a real database behind it, not only the ones that
      # require one. Broader than the per-pull-request job and slower.
      - run: make test-postgres
        env:
          VIDYA_TEST_DB_HOST: localhost
          VIDYA_TEST_DB_PORT: 5432

  mutation-full:
    name: Full mutation run (@vidya/api)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/package-lock.json

      - run: npm ci
        working-directory: modules

      # Rebuilds the whole-package score. Hours, which is exactly why it is here
      # and not on the pull-request path.
      - run: make mutate-full PKG=@vidya/api
